server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/homeboard;
    index index.html;

    access_log off;

    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

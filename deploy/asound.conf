# HomeBoard ALSA defaults.
# Playback: GEMBIRD USB speaker (card id Device).
# Capture: reSpeaker Flex XVF3800 USB firmware (card id L48K2Ch).

pcm.homeboard_usb_hw {
    type hw
    card "Device"
    device 0
}

pcm.homeboard_usb_dmix {
    type dmix
    ipc_key 20260929
    ipc_perm 0666
    slave {
        pcm "homeboard_usb_hw"
        format S16_LE
        rate 48000
        channels 2
    }
}

pcm.homeboard_mic_hw {
    type hw
    card "L48K2Ch"
    device 0
}

pcm.homeboard_mic_dsnoop {
    type dsnoop
    ipc_key 20260930
    ipc_perm 0666
    slave {
        pcm "homeboard_mic_hw"
        format S16_LE
        rate 48000
        channels 2
    }
}

pcm.homeboard_mic {
    type plug
    slave.pcm "homeboard_mic_dsnoop"
}

pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "homeboard_usb_dmix"
    }
    capture.pcm "homeboard_mic"
}

ctl.!default {
    type hw
    card "Device"
}
